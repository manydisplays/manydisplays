name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (universal, release)
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Test
        run: swift test
      - name: Package (ad-hoc signed, for the artifact only)
        run: CODESIGN_IDENTITY=- scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ManyDisplays-unsigned
          path: build/ManyDisplays.app

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftformat
      - run: swiftformat --lint .
