  <!-- Many Displays logo. Generated by scripts/make-logo.swift from Resources/AppIcon.svg; wordmark: Inter Display SemiBold (OFL) as outlines. -->
  <g transform="translate(-19.42 -19.42) scale(0.19)">
  <!--
    Many Displays app icon (master): two identical displays as a friendly face. The window on each
    screen is an eye and the keyboard is the mouth. Warm gradient tile.
    macOS icon grid: 1024 canvas, the tile is the central 824 px (corner radius 185).
    scripts/make-icon.swift renders this file to Resources/AppIcon.icns and PNG exports;
    scripts/make-logo.swift builds the horizontal logo from it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>
    <!-- One display (an eye): screen, stand, pupil with a highlight. -->
    <g id="eye">
      <rect x="188" y="352" width="288" height="230" rx="44" fill="#FFFFFF"/>
      <rect x="312" y="582" width="40" height="36" fill="#FFFFFF"/>
      <rect x="257" y="618" width="150" height="18" rx="9" fill="#FFFFFF"/>
      <rect x="306" y="430" width="120" height="96" rx="20" fill="#1B1F3B"/>
      <circle cx="334" cy="454" r="14" fill="#FFFFFF"/>
    </g>
    <!-- The keyboard (mouth): keys barely tinted so they only show at large sizes. -->
    <g id="keyboard" fill="#F2A23C" fill-opacity="0.45">
      <rect x="332" y="664" width="360" height="42" rx="12" fill="#FFFFFF" fill-opacity="1"/>
      <rect x="346" y="674" width="20" height="10" rx="3"/><rect x="372" y="674" width="20" height="10" rx="3"/><rect x="398" y="674" width="20" height="10" rx="3"/><rect x="424" y="674" width="20" height="10" rx="3"/><rect x="450" y="674" width="20" height="10" rx="3"/><rect x="476" y="674" width="20" height="10" rx="3"/><rect x="502" y="674" width="20" height="10" rx="3"/><rect x="528" y="674" width="20" height="10" rx="3"/><rect x="554" y="674" width="20" height="10" rx="3"/><rect x="580" y="674" width="20" height="10" rx="3"/><rect x="606" y="674" width="20" height="10" rx="3"/><rect x="632" y="674" width="20" height="10" rx="3"/><rect x="658" y="674" width="20" height="10" rx="3"/>
      <rect x="346" y="688" width="20" height="10" rx="3"/><rect x="372" y="688" width="20" height="10" rx="3"/><rect x="398" y="688" width="228" height="10" rx="3"/><rect x="632" y="688" width="20" height="10" rx="3"/><rect x="658" y="688" width="20" height="10" rx="3"/>
    </g>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(0 -14)">
    <use href="#eye"/>
    <use href="#eye" x="360"/>
    <use href="#keyboard"/>
  </g>
</g>
